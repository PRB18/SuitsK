name: Build macOS Package

on:
  workflow_dispatch:          # run manually from GitHub UI with one click
  push:
    tags:
      - 'v*'                  # also auto-runs when you push a version tag (e.g. v1.0.2)

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js 22 (matches your engines field) ─────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install production dependencies natively on macOS ───────────────
      #       better-sqlite3-multiple-ciphers compiles here, so it will work
      #       on the client's Mac without any extra steps.
      - name: Install production dependencies
        run: npm ci --omit=dev

      # ── 4. Stage the macOS package folder ─────────────────────────────────
      - name: Stage macOS package
        run: |
          OUTPUT="dist/KrishnaSuits-macOS"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/runtime"

          # Copy app source
          cp -R public server "$OUTPUT/"
          cp package.json package-lock.json "$OUTPUT/"

          # Copy launcher scripts
          cp Start-Krishna-Suits.command Stop-Krishna-Suits.sh "$OUTPUT/"
          chmod +x "$OUTPUT/Start-Krishna-Suits.command" "$OUTPUT/Stop-Krishna-Suits.sh"

          # Bundle the Node binary so the client doesn't need Node installed
          cp "$(command -v node)" "$OUTPUT/runtime/node"
          chmod +x "$OUTPUT/runtime/node"

          # Install deps inside the staged folder so native modules match macOS
          (cd "$OUTPUT" && npm ci --omit=dev)

      # ── 5. Zip the package ─────────────────────────────────────────────────
      - name: Create zip archive
        run: |
          cd dist
          zip -r KrishnaSuits-macOS.zip KrishnaSuits-macOS
          echo "Archive created: dist/KrishnaSuits-macOS.zip"

      # ── 6. Upload as a downloadable GitHub artifact ────────────────────────
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: KrishnaSuits-macOS
          path: dist/KrishnaSuits-macOS.zip
          retention-days: 30      # artifact kept for 30 days; increase if needed
