name: Build macOS Package

on:
  workflow_dispatch:        # run manually from the GitHub Actions tab
  push:
    tags:
      - 'v*'               # also auto-runs on version tags like v1.0.2

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node 22 ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Install production deps natively on macOS ───────────────────────
      #       better-sqlite3-multiple-ciphers compiles its .node binding here.
      #       This is why we MUST build on a real Mac runner.
      - name: Install production dependencies
        run: npm ci --omit=dev

      # ── 4. Bundle the app + bundled Node binary ────────────────────────────
      - name: Stage macOS package
        run: |
          OUTPUT="dist/KrishnaSuits-macOS"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          # Copy app source files
          cp -R public server "$OUTPUT/"
          cp package.json "$OUTPUT/"

          # Copy the launcher scripts (already in repo root)
          cp Start-Krishna-Suits.command "$OUTPUT/"
          cp Stop-Krishna-Suits.sh "$OUTPUT/"
          chmod +x "$OUTPUT/Start-Krishna-Suits.command"
          chmod +x "$OUTPUT/Stop-Krishna-Suits.sh"

          # Bundle the system Node binary so the Mac user doesn't need Node
          mkdir -p "$OUTPUT/runtime"
          cp "$(command -v node)" "$OUTPUT/runtime/node"
          chmod +x "$OUTPUT/runtime/node"

          # Install deps inside the package folder (native .node binding for Mac)
          (cd "$OUTPUT" && npm ci --omit=dev)

          # Patch launcher to use bundled node
          sed -i '' 's|node server/index.js|"$(dirname "$0")/runtime/node" server/index.js|g' \
            "$OUTPUT/Start-Krishna-Suits.command" || true

      # ── 5. Zip it up ───────────────────────────────────────────────────────
      - name: Create zip archive
        run: |
          cd dist
          zip -r KrishnaSuits-macOS.zip KrishnaSuits-macOS
          echo "✅ Archive size: $(du -sh KrishnaSuits-macOS.zip)"

      # ── 6. Upload as downloadable artifact ─────────────────────────────────
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: KrishnaSuits-macOS
          path: dist/KrishnaSuits-macOS.zip
          retention-days: 30
