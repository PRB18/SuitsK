name: Build macOS Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Build macOS package
        run: |
          set -e
          OUTPUT="dist/KrishnaSuits-macOS"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/runtime"

          # Copy app source
          cp -R public "$OUTPUT/"
          cp -R server "$OUTPUT/"
          cp package.json "$OUTPUT/"

          # Install native deps inside package (compiles better-sqlite3 for Mac)
          (cd "$OUTPUT" && npm install --omit=dev --ignore-scripts=false)

          # Bundle Node binary so the user doesn't need Node installed
          cp "$(command -v node)" "$OUTPUT/runtime/node"
          chmod +x "$OUTPUT/runtime/node"

          # Write a clean launcher script
          cat > "$OUTPUT/Start Krishna Suits.command" << 'LAUNCHER'
          #!/bin/sh
          set -eu
          DIR="$(cd "$(dirname "$0")" && pwd)"
          NODE="$DIR/runtime/node"
          cd "$DIR"
          "$NODE" server/index.js &
          sleep 1.5
          open http://127.0.0.1:3737
          echo "Krishna Suits is running at http://127.0.0.1:3737"
          echo "Close this window to stop the server."
          wait
          LAUNCHER
          chmod +x "$OUTPUT/Start Krishna Suits.command"

      - name: Zip archive
        run: |
          cd dist
          zip -r KrishnaSuits-macOS.zip KrishnaSuits-macOS
          echo "Done: $(du -sh KrishnaSuits-macOS.zip)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrishnaSuits-macOS
          path: dist/KrishnaSuits-macOS.zip
          retention-days: 30
