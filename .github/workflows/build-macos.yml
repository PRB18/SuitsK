name: Build macOS App

on:
  workflow_dispatch:        # ← run manually from GitHub Actions tab with one click
  push:
    tags:
      - 'v*'               # ← also auto-runs when you push a tag like v1.0.2

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node 22 ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install app deps natively on macOS ──────────────────────────────
      #       better-sqlite3-multiple-ciphers compiles its native .node binding
      #       here — this is why we MUST build on a real Mac runner.
      - name: Install dependencies
        run: npm ci --omit=dev

      # ── 4. Build a self-contained binary with pkg ──────────────────────────
      #       pkg bundles Node + your app into one executable.
      #       The user just double-clicks KrishnaSuits — no Node install needed.
      - name: Build standalone binary (pkg)
        run: |
          npx pkg@5 server/index.js \
            --target node22-macos-arm64,node22-macos-x64 \
            --output dist/KrishnaSuits \
            --assets "public/**,server/**" \
            --compress GZip
          ls -lh dist/

      # ── 5. Create a clean .app launcher folder ─────────────────────────────
      - name: Bundle into .app folder
        run: |
          APP="dist/Krishna Suits.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          mkdir -p "$MACOS" "$RESOURCES"

          # Copy the pkg binary (arm64 build — universal users can use x64 too)
          cp dist/KrishnaSuits-macos-arm64 "$MACOS/KrishnaSuits"
          chmod +x "$MACOS/KrishnaSuits"

          # Launcher shell script that opens the browser after starting the server
          cat > "$MACOS/start" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          "$DIR/KrishnaSuits" &
          sleep 1.5
          open http://127.0.0.1:3737
          EOF
          chmod +x "$MACOS/start"

          # Info.plist so macOS recognises it as an app
          cat > "$CONTENTS/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Krishna Suits</string>
            <key>CFBundleDisplayName</key>
            <string>Krishna Suits — Bespoke</string>
            <key>CFBundleIdentifier</key>
            <string>com.krishnasuits.bespoke</string>
            <key>CFBundleVersion</key>
            <string>1.0.1</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.1</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>start</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          echo "App bundle created:"
          find "$APP" -type f | head -20

      # ── 6. Also zip the x64 binary for Intel Macs ─────────────────────────
      - name: Package both architectures into a zip
        run: |
          cd dist
          # Rename for clarity
          mv KrishnaSuits-macos-arm64 KrishnaSuits-Apple-Silicon
          mv KrishnaSuits-macos-x64  KrishnaSuits-Intel-Mac
          zip -r "KrishnaSuits-macOS.zip" \
            "Krishna Suits.app" \
            KrishnaSuits-Apple-Silicon \
            KrishnaSuits-Intel-Mac
          echo "Zip size: $(du -sh KrishnaSuits-macOS.zip)"

      # ── 7. Upload artifact — download from the GitHub Actions tab ──────────
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: KrishnaSuits-macOS
          path: dist/KrishnaSuits-macOS.zip
          retention-days: 30
