<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krishna Suits — Bespoke Tailoring Configurator</title>
  <meta name="description" content="Congressional The Bespoke — Atelier management system for bespoke tailoring: client profiles, measurements, inventory, schedule, and workshop management.">
  <link rel="stylesheet" href="/styles/main.css?v=14">
  <link rel="stylesheet" href="/styles/print.css" media="print">
</head>
<body>
  <!-- Dynamic screens mount here -->
  <div id="app" class="app-root">
    <div class="initial-loading">
      <div class="initial-spinner"></div>
      <p>Initializing secure vault...</p>
    </div>
  </div>

  <!--
    Print Root: Always in the DOM but visually hidden on-screen.
    When window.print() is called, @media print shows ONLY this div.
    JavaScript populates it with the 2-page measurement card before printing.
  -->
  <div id="print-root" aria-hidden="true"></div>

  <!-- Security: DOMPurify for HTML sanitization (Phase 2) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha512-H+rglffZ6f5gF7UJgv/4O8644z/dS1EnB1Xf41D0vEE8w8mXUvR3Y4F7TqB3wY2c45YpX0j6gQckZ12I68iR0w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <script type="module" src="/js/app.js?v=14"></script>
</body>
</html>
